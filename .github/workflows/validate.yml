name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate_personalities.py
      - run: python3 scripts/check_xs.py --no-game
      - run: python3 scripts/tests/test_check_xs.py
